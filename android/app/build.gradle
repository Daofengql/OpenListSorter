plugins {
    id 'com.android.application'
}

def configuredKeystorePath = System.getProperty('KEYSTORE')
def bundledReleaseKeystore = rootProject.file('build/signing/openlistsorter-release.jks')
def releaseKeystore = configuredKeystorePath != null
        ? file(configuredKeystorePath)
        : (bundledReleaseKeystore.isFile()
        ? bundledReleaseKeystore
        : file('/data/env/android/keystore/openlistsorter-release.jks'))

android {
    namespace 'com.openlistsorter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openlistsorter.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
    }

    signingConfigs {
        release {
            // Prefer the repository-local build signing material; -DKEYSTORE can override it.
            storeFile releaseKeystore
            storePassword project.findProperty('KEYSTORE_PASSWORD') ?: 'openlistsorter'
            keyAlias project.findProperty('KEY_ALIAS') ?: 'openlistsorter-release'
            keyPassword project.findProperty('KEY_PASSWORD') ?: 'openlistsorter'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.aliyun:libheif:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.register('verifyLibheifPackaging') {
    dependsOn 'assembleDebug'
    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apk.isFile()) throw new GradleException('Debug APK not found: ' + apk)
        def abis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            abis.each { abi ->
                ['libheif_jni.so', 'libc++_shared.so'].each { library ->
                    def path = 'lib/' + abi + '/' + library
                    if (zip.getEntry(path) == null) {
                        throw new GradleException('Missing native HEIF runtime: ' + path)
                    }
                }
            }
        }
    }
}
